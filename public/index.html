<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Quick Tester</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    input { display: block; width: 95%; margin-bottom: 10px; padding: 8px; }
    button { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 4px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Backend Tester</h2>

  <!-- REGISTER FORM -->
  <form id="regForm">
    <h3>1. Register User</h3>
    <input type="text" id="username" placeholder="Username" required>
    <input type="text" id="fathername" placeholder="Father Name" required>
    <input type="text" id="contact" placeholder="Contact Number" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <!-- LOGIN FORM -->
  <form id="loginForm">
    <h3>2. Login (Get JWT Token)</h3>
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <!-- INVOICE FORM -->
  <form id="invoiceForm">
    <h3>3. Create Invoice</h3>
    <input type="text" id="invNum" placeholder="Invoice Number (e.g. INV-101)" required>
    <input type="number" id="invAmt" placeholder="Amount" required>
    <button type="submit">Create Invoice</button>
  </form>

  <h3>Response Log:</h3>
  <pre id="output">Submit any form above to test the API...</pre>

  <script>
    let jwtToken = '';

    const log = (data) => document.getElementById('output').textContent = JSON.stringify(data, null, 2);

    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          fathername: document.getElementById('fathername').value,
          contact: document.getElementById('contact').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      });
      log(await res.json());
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (data.token) jwtToken = data.token;
      log(data);
    });

    document.getElementById('invoiceForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!jwtToken) return log({ error: 'Please login first to get your JWT token!' });

      const res = await fetch('/api/invoices', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${jwtToken}`
        },
        body: JSON.stringify({
          invoice_number: document.getElementById('invNum').value,
          amount: Number(document.getElementById('invAmt').value)
        })
      });
      log(await res.json());
    });
  </script>
</body>
</html>
